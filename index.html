
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <title>HitAds.ca - Canada's Free Business Classifieds</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#cc2d2d", // HitAds red
                        "primary-hover": "#a82222",
                        "primary-light": "#e85d4a", // Warm red-orange
                        "primary-soft": "#f4a261", // Light orange accent
                        "primary-neutral": "#c9b8ad", // Warm neutral
                        "accent": "#3b5998", // Logo blue accent
                        "background-light": "#fdf8f6",
                        "background-dark": "#1a1a1a",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .bg-gradient-mesh {
          background-color: #fdf8f6;
          background-image: 
            radial-gradient(at 0% 0%, rgba(232, 93, 74, 0.10) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(244, 162, 97, 0.08) 0px, transparent 50%);
        }
    </style>
<script type="importmap">

</head>
