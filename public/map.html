<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approximate Location Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
    }
    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(241, 245, 249, 0.8);
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-spinner">
    <div class="spinner"></div>
    <span>Loading map area...</span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');
    const zoom = parseInt(urlParams.get('z')) || 13;

    // Initialize map default view centered on Toronto
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: false
    }).setView([43.6532, -79.3832], zoom);

    // Colorful tiles from OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const loadingEl = document.getElementById('loading');
    
    function hideLoading() {
      loadingEl.style.opacity = '0';
      setTimeout(() => {
        loadingEl.style.display = 'none';
      }, 300);
    }

    const latParam = parseFloat(urlParams.get('lat'));
    const lngParam = parseFloat(urlParams.get('lng'));

    if (!isNaN(latParam) && !isNaN(lngParam)) {
      // Use direct coordinates if provided
      const center = [latParam, lngParam];
      map.setView(center, zoom);
      
      // Draw approximate location highlight circle (600m radius)
      L.circle(center, {
        color: '#2563eb',
        fillColor: '#3b82f6',
        fillOpacity: 0.15,
        weight: 2,
        radius: 600
      }).addTo(map);
      
      hideLoading();
    } else if (query && query.trim() !== '') {
      // Geocode using OpenStreetMap's Nominatim search (bounded to Canada for better local matching)
      fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&countrycodes=ca&format=json&limit=1`, {
        headers: {
          'Accept-Language': 'en'
        }
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          const center = [lat, lon];
          map.setView(center, zoom);

          L.circle(center, {
            color: '#2563eb',
            fillColor: '#3b82f6',
            fillOpacity: 0.15,
            weight: 2,
            radius: 600
          }).addTo(map);
        } else {
          console.warn('Address not found via geocoding, showing default region.');
        }
        hideLoading();
      })
      .catch(err => {
        console.error('Geocoding search failed:', err);
        hideLoading();
      });
    } else {
      hideLoading();
    }
  </script>
</body>
</html>
